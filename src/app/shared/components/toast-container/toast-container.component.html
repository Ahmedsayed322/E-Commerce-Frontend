<div class="fixed bottom-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none px-4 sm:px-0">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-elevated border backdrop-blur-md transition-all duration-300 transform translate-y-0"
      [ngClass]="{
        'bg-emerald-950/90 text-emerald-100 border-emerald-800/60': toast.type === 'success',
        'bg-rose-950/90 text-rose-100 border-rose-800/60': toast.type === 'error',
        'bg-indigo-950/90 text-indigo-100 border-indigo-800/60': toast.type === 'info',
        'bg-amber-950/90 text-amber-100 border-amber-800/60': toast.type === 'warning'
      }"
    >
      <!-- Icon -->
      <div class="mt-0.5 shrink-0">
        @if (toast.type === 'success') {
          <div class="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
            </svg>
          </div>
        } @else if (toast.type === 'error') {
          <div class="w-7 h-7 rounded-full bg-rose-500/20 text-rose-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </div>
        } @else if (toast.type === 'warning') {
          <div class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
        } @else {
          <div class="w-7 h-7 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        }
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0 pr-1">
        @if (toast.title) {
          <h4 class="text-sm font-semibold tracking-tight text-white mb-0.5">{{ toast.title }}</h4>
        }
        <p class="text-xs opacity-90 leading-relaxed">{{ toast.message }}</p>
      </div>

      <!-- Close -->
      <button
        (click)="toastService.remove(toast.id)"
        class="shrink-0 p-1 text-white/50 hover:text-white rounded-lg transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  }
</div>
